<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Paintings</title>

    <script src="/spotlight.bundle.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <header class="logo-container">
        <!-- Left Side: Links back home -->
        <a href="/index.html" class="header-link">
            <img src="logo.webp" alt="app logo" class="logo-img">
            <h1 class="logo-text">
                James Milillo<span class="domain">.com</span>
            </h1>
        </a>
    </header>

    <div class="page-content">
        <h1>My Paintings</h1>
        <p class="app-tagline">Acrylic, a canvas, and my three biggest fans.</p>
        <p>Painting is my newest hobby, mostly acrylic on small canvases and mostly inspired by missing my three
            schnauzers. Consider this gallery a work in progress, more
            canvases will show up here as inspiration strikes.</p>
    </div>

    <!-- 2. The Grid Container -->
    <div class="gallery">
        <!-- Title is the painting's name; description is "Canvas #N · Medium", with an optional note on a second line (&#10;) -->
        <a class="spotlight" href="theboys.webp" data-title="Merlin, Mojo &amp; Magic"
            data-description="Canvas #1 · Acrylic on 5x7&#10;My three boys, with their names on the bones">
            <img src="theboys.webp" alt="Three painted schnauzers">
        </a>

        <a class="spotlight" href="threeboys.webp" data-title="The Originals"
            data-description="The inspiration for Canvas #1&#10;My boys waiting for a treat">
            <img src="threeboys.webp" alt="Three real schnauzers">
        </a>

        <a class="spotlight" href="nightsky.webp" data-title="Starry Pines"
            data-description="Canvas #2 · Acrylic on 5x7">
            <img src="nightsky.webp" alt="Night sky over a pine forest">
        </a>

        <a class="spotlight" href="nightskylibra.webp" data-title="Libra Rising"
            data-description="Canvas #2 · Acrylic on 5x7&#10;Starry Pines, finished with the Libra constellation">
            <img src="nightskylibra.webp" alt="Night sky with the Libra constellation">
        </a>

        <!-- Repeat this anchor block for your remaining photos -->
    </div>
</body>

</html>
