<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Carvings & Paintings</title>

    <script src="/spotlight.bundle.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <header class="logo-container">
        <!-- Left Side: Links back home -->
        <a href="/index.html" class="header-link">
            <img src="logo.webp" alt="app logo" class="logo-img">
            <h1 class="logo-text">
                James Milillo<span class="domain">.com</span>
            </h1>
        </a>
    </header>

    <div class="page-content">
        <h1>My Paintings</h1>
        <p class="app-tagline">Acrylic, a canvas, and my three biggest fans.</p>
        <p>Painting is my newest hobby, mostly acrylic on small canvases and mostly inspired by missing my three
            schnauzers. Consider this gallery a work in progress, more
            canvases will show up here as inspiration strikes.</p>
    </div>

    <!-- 2. The Grid Container -->
    <div class="gallery">
        <!-- Wrap each image in an anchor tag with class="spotlight" -->
        <a class="spotlight" href="theboys.webp" data-title="Canvas #1" data-description="My boys in acrylic on a 5x7">
            <img src="theboys.webp" alt="Three painted schnauzers">
        </a>

        <a class="spotlight" href="threeboys.webp" data-title="The Inspiration"
            data-description="My boys waiting for a treat">
            <img src="threeboys.webp" alt="Three real schnauzers">
        </a>

        <a class="spotlight" href="nightsky.webp" data-title="Canvas #2" data-description="Night sky on a 5x7">
            <img src="nightsky.webp" alt="night sky">
        </a>

        <a class="spotlight" href="nightskylibra.webp" data-title="Canvas #2 - Libra"
            data-description="Libra constellation in the night sky on a 5x7">
            <img src="nightskylibra.webp" alt="night sky">
        </a>

        <!-- Repeat this anchor block for your remaining photos -->
    </div>
</body>

</html>
